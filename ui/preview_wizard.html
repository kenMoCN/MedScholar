<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedScholar 快速配置向导</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  
  <!-- Local Scripts with Fallbacks -->
  <script src="web/assets/tailwindcss.js"></script>
  <script>
    if (!window.tailwind) {
      document.write('<script src="https://cdn.tailwindcss.com"><\/script>');
    }
  </script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', '"PingFang SC"', '"Microsoft YaHei"', 'sans-serif'],
            display: ['Outfit', 'Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#F4F5FF',
              100: '#E9ECFF',
              200: '#D5DAFF',
              300: '#A8B4FF',
              400: '#7B88FF',
              500: '#5B6CFF',
              600: '#4858EC',
              700: '#3846D4',
            },
            surface: {
              bg: '#FAFAFA',
              card: '#FFFFFF',
              border: '#E5E5E5',
              subtle: '#EEEEEE',
              muted: '#71717A',
            }
          },
          boxShadow: {
            'soft-xs': '0 1px 3px rgba(0,0,0,0.02), 0 1px 2px rgba(0,0,0,0.03)',
            'soft-sm': '0 2px 8px rgba(0,0,0,0.03), 0 1px 3px rgba(0,0,0,0.02)',
            'soft-md': '0 6px 20px -2px rgba(0,0,0,0.04), 0 2px 6px -1px rgba(0,0,0,0.02)',
            'soft-lg': '0 12px 32px -4px rgba(0,0,0,0.06), 0 4px 12px -2px rgba(0,0,0,0.03)',
            'card-selected': '0 0 0 1px #5B6CFF, 0 10px 28px -4px rgba(91, 108, 255, 0.16)',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(12px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            popIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            fadeOut: {
              '0%': { opacity: '1' },
              '100%': { opacity: '0' },
            }
          },
          animation: {
            'fade-in-up': 'fadeInUp 280ms cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'pop-in': 'fadeIn 250ms cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'fade-in': 'fadeIn 250ms cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'fade-out': 'fadeOut 220ms cubic-bezier(0.4, 0, 1, 1) forwards',
          }
        }
      }
    };
  </script>

  <script src="web/assets/react.min.js"></script>
  <script src="web/assets/react-dom.min.js"></script>
  <script src="web/assets/babel.min.js"></script>
  <script src="web/assets/qwebchannel.js"></script>
  <script>
    if (!window.React) {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"><\/script>');
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"><\/script>');
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"><\/script>');
    }
  </script>

  <style>
    @keyframes modalFadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes modalFadeOut {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }
    .modal-fade-in {
      animation: modalFadeIn 250ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .modal-fade-out {
      animation: modalFadeOut 220ms cubic-bezier(0.4, 0, 1, 1) forwards;
    }
    .modal-frosted-overlay {
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D4D4D8; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #A1A1AA; }

    /* Card Interactive Styles */
    .harness-card {
      transition: all 200ms cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      cursor: pointer;
    }
    
    .harness-card:hover {
      transform: translateY(-2px);
    }

    /* Soft Gradient Border for Hover / Selected (DeepSeek Harness style) */
    .card-border-default {
      border: 1px solid #E5E5E5;
      background: #FFFFFF;
    }
    .dark .card-border-default {
      border: 1px solid #27272A;
      background: #18181B;
    }

    .card-border-hover:hover {
      border: 1px solid transparent;
      background-image: linear-gradient(#FFFFFF, #FFFFFF), linear-gradient(135deg, rgba(91, 108, 255, 0.45), rgba(72, 88, 236, 0.20));
      background-origin: border-box;
      background-clip: padding-box, border-box;
      box-shadow: 0 8px 24px -4px rgba(91, 108, 255, 0.12), 0 2px 6px -1px rgba(0, 0, 0, 0.03);
    }
    .dark .card-border-hover:hover {
      background-image: linear-gradient(#18181B, #18181B), linear-gradient(135deg, rgba(91, 108, 255, 0.55), rgba(72, 88, 236, 0.30));
    }

    .card-border-selected {
      border: 1px solid transparent !important;
      background-image: linear-gradient(#FFFFFF, #FFFFFF), linear-gradient(135deg, #5B6CFF, #8B98FF) !important;
      background-origin: border-box;
      background-clip: padding-box, border-box;
      box-shadow: 0 0 0 1px rgba(91, 108, 255, 0.6), 0 10px 28px -4px rgba(91, 108, 255, 0.18) !important;
      transform: translateY(-2px);
    }
    .dark .card-border-selected {
      background-image: linear-gradient(#1E1E24, #1E1E24), linear-gradient(135deg, #5B6CFF, #8B98FF) !important;
      box-shadow: 0 0 0 1px rgba(91, 108, 255, 0.7), 0 10px 28px -4px rgba(91, 108, 255, 0.25) !important;
    }

    /* Dot Pulse */
    .dot-active-glow {
      box-shadow: 0 0 0 3px rgba(91, 108, 255, 0.25);
    }
  </style>
</head>
<body class="bg-[#FAFAFA] dark:bg-[#121214] text-[#18181B] dark:text-[#F4F4F5] antialiased selection:bg-[#5B6CFF]/15 selection:text-[#5B6CFF] min-h-screen font-sans transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- DeepSeek Harness Unified Stroke Icon Set (1.6px Stroke, Zero Color Emoji) ---
    const StrokeIcon = ({ name, size = 18, className = '' }) => {
      const strokeProps = {
        width: size,
        height: size,
        viewBox: '0 0 24 24',
        fill: 'none',

        strokeLinejoin: 'round',
        className
      };

      const icons = {
        // Navigation & Actions
        check: <polyline points="20 6 9 17 4 12" />,
        arrowRight: <path d="M5 12h14M12 5l7 7-7 7" />,
        arrowLeft: <path d="M19 12H5M12 19l-7-7 7-7" />,
        eye: (
          <g>
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />

        ),
        eyeOff: (
          <g>
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />

        fileText: (

            <line x1="16" y1="17" x2="8" y2="17" />
          </g>
        ),
        trash: (
          <g>
            <polyline points="3 6 5 6 21 6" />

        ),
        trash2: (
          <g>
            <polyline points="3 6 5 6 21 6" />

            <line x1="10" y1="11" x2="10" y2="17" />
            <line x1="14" y1="11" x2="14" y2="17" />
          </g>
        ),
        x: <path d="M18 6L6 18M6 6l12 12" />,
        settings: (
          <g>
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </g>
        ),
        plus: <path d="M12 5v14M5 12h14" />,

        // Features & Domain Stroke Icons
        visionScan: (
          <g>
            <rect x="3" y="3" width="18" height="18" rx="3" />
            <circle cx="8.5" cy="8.5" r="1.5" />
            <polyline points="21 15 16 10 5 21" />
          </g>
        ),
        bookOpen: (
          <g>
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
          </g>
        ),
        bookStack: (
          <g>
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
          </g>
        ),
        shieldCheck: (
          <g>
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            <polyline points="9 12 11 14 15 10" />
          </g>
        ),
        shieldLock: (
          <g>
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </g>
        ),
        zap: <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />,
        compass: (
          <g>
            <circle cx="12" cy="12" r="10" />
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" />
          </g>
        ),
        cpuChip: (
          <g>
            <rect x="4" y="4" width="16" height="16" rx="2" />
            <rect x="9" y="9" width="6" height="6" />
            <line x1="9" y1="1" x2="9" y2="4" />
            <line x1="15" y1="1" x2="15" y2="4" />
            <line x1="9" y1="20" x2="9" y2="23" />
            <line x1="15" y1="20" x2="15" y2="23" />
            <line x1="20" y1="9" x2="23" y2="9" />
            <line x1="20" y1="14" x2="23" y2="14" />
            <line x1="1" y1="9" x2="4" y2="9" />
            <line x1="1" y1="14" x2="4" y2="14" />
          </g>
        ),
        bookmarkPin: (
          <g>
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />

        ),
        cleanAlign: (
          <g>
            <line x1="21" y1="10" x2="3" y2="10" />
            <line x1="21" y1="6" x2="3" y2="6" />
            <line x1="21" y1="14" x2="3" y2="14" />
            <line x1="11" y1="18" x2="3" y2="18" />
          </g>
        ),
        playCircle: (
          <g>
            <circle cx="12" cy="12" r="10" />
            <polygon points="10 8 16 12 10 16 10 8" />
          </g>
        ),
        sun: (
          <g>
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </g>
        ),
        moon: <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />,
        monitor: (
          <g>
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2" />
            <line x1="8" y1="21" x2="16" y2="21" />
            <line x1="12" y1="17" x2="12" y2="21" />
          </g>
        ),
        rocket: (
          <g>
            <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z" />
            <path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z" />
            <path d="M9 12H4s.55-3.03 2-4.5c1.62-1.63 5-2.5 5-2.5" />
            <path d="M12 9v5s3.03-.55 4.5-2c1.63-1.62 2.5-5 2.5-5" />
          </g>
        )
      };

      return <svg {...strokeProps}>{icons[name] || null}</svg>;
    };

    // --- Interactive Card Component (Clean Stroke Line Style) ---
    const OptionCard = ({
      title,
      description,
      strategy,
      iconName,
      badge,
      isSelected,
      onSelect,
      className = ''
    }) => {
      return (
        <div
          onClick={onSelect}
          className={`harness-card card-border-hover rounded-[18px] p-6 select-none relative flex flex-col justify-between ${
            isSelected ? 'card-border-selected' : 'card-border-default shadow-soft-sm'
          } ${className}`}
        >
          {/* Top Row: Badge + Checkmark */}
          <div className="flex items-start justify-between mb-4">
            {badge ? (
              <span className="inline-flex items-center px-2.5 py-1 rounded-[7px] text-[10px] font-bold font-mono tracking-wider bg-[#F4F5FF] dark:bg-[#232438] text-[#5B6CFF] dark:text-[#8B98FF] border border-[#5B6CFF]/20">
                {badge}
              </span>
            ) : <div />}

            {/* Checkmark Capsule (Soft blue-purple, pop-in animation) */}
            <div
              className={`w-5 h-5 rounded-full flex items-center justify-center transition-all duration-200 ${
                isSelected
                  ? 'bg-[#5B6CFF] text-white shadow-soft-xs animate-pop-in'
                  : 'border border-[#D0D0D0] dark:border-[#3F3F46] bg-transparent text-transparent'
              }`}
            >
              {isSelected && <StrokeIcon name="check" size={12} className="stroke-[2.5]" />}
            </div>
          </div>

          {/* Center Content: Stroke Icon + Title + Description */}
          <div>
            <div className="flex items-center space-x-3 mb-2.5">
              <div className="w-8 h-8 rounded-[9px] bg-[#F4F4F5] dark:bg-[#27272A] text-[#5B6CFF] flex items-center justify-center flex-shrink-0">
                <StrokeIcon name={iconName} size={18} />
              </div>
              <h3 className="text-base font-bold text-[#18181B] dark:text-[#F4F4F5] tracking-tight">
                {title}
              </h3>
            </div>
            
            {description && (
              <p className="text-[13px] text-[#52525B] dark:text-[#A1A1AA] leading-relaxed mb-3">
                {description}
              </p>
            )}
          </div>

          {/* Bottom Strategy Hint (if present) */}
          {strategy && (
            <div className="pt-2.5 mt-auto border-t border-[#F4F4F5] dark:border-[#27272A] text-[11px] font-medium text-[#71717A] dark:text-[#71717A] flex items-center space-x-1">
              <span className="text-[#5B6CFF] font-semibold">策略说明</span>
              <span>·</span>
              <span className="truncate">{strategy}</span>
            </div>
          )}
        </div>
      );
    };

    // --- Main Wizard Component ---
    function WizardPreviewApp() {
      // Step Index: 0 = 欢迎页, 1..6 = 配置流程
      const [currentStep, setCurrentStep] = useState(0);
      const TOTAL_STEPS = 6;

      // Config State
      const [config, setConfig] = useState({
        enableImageRecognition: true,
        deepseekModelName: 'deepseek-flash',
        deepseekApiKey: '',
        doubaoVisionModelName: 'doubao-seed-evolving',
        doubaoApiKey: '',
        proficiency: 'beginner',
        needTextbook: true,
        selectedFiles: [],
        citeLocation: true,
        requireFileApproval: true,
        themeMode: 'light'
      });

      // UI Control States
      const [showDsKey, setShowDsKey] = useState(false);
      const [showDbKey, setShowDbKey] = useState(false);
      const [showCompletedModal, setShowCompletedModal] = useState(false);
      const [showTutorialModal, setShowTutorialModal] = useState(false);
      const [tutorialProvider, setTutorialProvider] = useState('deepseek');
      const [tutorialImages, setTutorialImages] = useState({
        deepseek: Array.from({ length: 7 }, (_, i) => `Process/ds/${i + 1}.png`),
        doubao: Array.from({ length: 11 }, (_, i) => `Process/db/${i + 1}.png`),
      });
      const [tutorialIndex, setTutorialIndex] = useState(0);
      const [showApiKeyErrors, setShowApiKeyErrors] = useState(false);
      const [showAdvancedModelsModal, setShowAdvancedModelsModal] = useState(false);
      const [advancedTab, setAdvancedTab] = useState('models');
      const [advancedModelsList, setAdvancedModelsList] = useState([
        {
          id: 'reasoning_main',
          provider: 'deepseek',
          name: 'deepseek-flash',
          apiBase: 'https://api.deepseek.com/v1',
          protocol: 'openai_compatible',
          capabilities: 'text,structured_output',
          apiKey: '',
          enabled: true,
          showKey: false,
        },
        {
          id: 'vision_main',
          provider: 'doubao',
          name: 'doubao-seed-evolving',
          apiBase: 'https://ark.cn-beijing.volces.com/api/v3',
          protocol: 'vendor_or_openai_compatible',
          capabilities: 'vision,text',
          apiKey: '',
          enabled: true,
          showKey: false,
        }
      ]);
      const [advancedRoutes, setAdvancedRoutes] = useState({
        reasoning: 'reasoning_main',
        planning: 'reasoning_main',
        verification: 'reasoning_main',
        vision: 'vision_main',
      });
      const [advancedPingStatus, setAdvancedPingStatus] = useState(null);
      const tutorialPreloadsRef = useRef([]);
      const tutorialTriggerRefs = useRef({});
      const tutorialCloseButtonRef = useRef(null);
      const tutorialOverlayRef = useRef(null);
      const TUTORIAL_IMAGES = tutorialImages[tutorialProvider] || [];

      const [closingWizardModal, setClosingWizardModal] = useState(null);

      const closeAdvancedModels = () => {
        setClosingWizardModal('advanced');
        setTimeout(() => {
          setShowAdvancedModelsModal(false);
          setClosingWizardModal(null);
        }, 220);
      };

      const closeCompletedModal = () => {
        setClosingWizardModal('completed');
        setTimeout(() => {
          setShowCompletedModal(false);
          setClosingWizardModal(null);
        }, 220);
      };

      const openTutorial = (provider) => {
        setTutorialProvider(provider);
        setTutorialIndex(0);
        setShowTutorialModal(true);
      };
      const closeTutorial = () => {
        setClosingWizardModal('tutorial');
        setTimeout(() => {
          setShowTutorialModal(false);
          setClosingWizardModal(null);
        }, 220);
      };
      const openProviderSite = (provider) => {
        if (window.wizardBridge?.openProviderSite) {
          window.wizardBridge.openProviderSite(provider);
        }
      };

      useEffect(() => {
        if (!showTutorialModal) return;
        tutorialPreloadsRef.current = TUTORIAL_IMAGES.map((path) => {
          const image = new Image();
          image.onerror = () => {
            if (!image.dataset?.fallback) {
              image.dataset = { fallback: 'true' };
              image.src = '../' + path;
            }
          };
          image.src = path;

            if (event.shiftKey && document.activeElement === first) {

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div className="p-3.5 rounded-[12px] border border-[#EEEEEE] dark:border-[#27272A] bg-[#FAFAFA] dark:bg-[#202025] space-y-1.5">
                          <label className="block text-xs font-bold text-[#18181B] dark:text-white">答案推理 (Reasoning Role)</label>
                          <p className="text-[11px] text-[#71717A] dark:text-[#A1A1AA]">负责主干医学逻辑推导与完整长文答案组织</p>
                          <select
                            value={advancedRoutes.reasoning}
                            onChange={(e) => setAdvancedRoutes({ ...advancedRoutes, reasoning: e.target.value })}
                            className="w-full px-3 py-1.5 rounded-[8px] border border-[#E5E7EB] dark:border-[#3F3F46] bg-white dark:bg-[#27272A] text-xs font-mono text-[#18181B] dark:text-white"
                          >
                            {advancedModelsList.map(m => (
                              <option key={m.id} value={m.id}>{m.provider} · {m.name} ({m.id})</option>
                            ))}
                          </select>
                        </div>

                        <div className="p-3.5 rounded-[12px] border border-[#EEEEEE] dark:border-[#27272A] bg-[#FAFAFA] dark:bg-[#202025] space-y-1.5">
                          <label className="block text-xs font-bold text-[#18181B] dark:text-white">任务规划 (Planning Role)</label>
                          <p className="text-[11px] text-[#71717A] dark:text-[#A1A1AA]">负责将复杂临床提问拆解为细粒度多步执行链路</p>
                          <select
                            value={advancedRoutes.planning}
                            onChange={(e) => setAdvancedRoutes({ ...advancedRoutes, planning: e.target.value })}
                            className="w-full px-3 py-1.5 rounded-[8px] border border-[#E5E7EB] dark:border-[#3F3F46] bg-white dark:bg-[#27272A] text-xs font-mono text-[#18181B] dark:text-white"
                          >
                            {advancedModelsList.map(m => (
                              <option key={m.id} value={m.id}>{m.provider} · {m.name} ({m.id})</option>
                            ))}
                          </select>
                        </div>

                        <div className="p-3.5 rounded-[12px] border border-[#EEEEEE] dark:border-[#27272A] bg-[#FAFAFA] dark:bg-[#202025] space-y-1.5">
                          <label className="block text-xs font-bold text-[#18181B] dark:text-white">答案核验 (Verification Role)</label>
                          <p className="text-[11px] text-[#71717A] dark:text-[#A1A1AA]">严格基于教材证据反思并核验是否存在未证实断言</p>
                          <select
                            value={advancedRoutes.verification}
                            onChange={(e) => setAdvancedRoutes({ ...advancedRoutes, verification: e.target.value })}
                            className="w-full px-3 py-1.5 rounded-[8px] border border-[#E5E7EB] dark:border-[#3F3F46] bg-white dark:bg-[#27272A] text-xs font-mono text-[#18181B] dark:text-white"
                          >
                            {advancedModelsList.map(m => (
                              <option key={m.id} value={m.id}>{m.provider} · {m.name} ({m.id})</option>
                            ))}
                          </select>
                        </div>

                        <div className="p-3.5 rounded-[12px] border border-[#EEEEEE] dark:border-[#27272A] bg-[#FAFAFA] dark:bg-[#202025] space-y-1.5">
                          <label className="block text-xs font-bold text-[#18181B] dark:text-white">图片识别 (Vision Role)</label>
                          <p className="text-[11px] text-[#71717A] dark:text-[#A1A1AA]">负责病理标本切片、课件幻灯片与题目图表解析</p>
                          <select
                            value={advancedRoutes.vision}
                            onChange={(e) => setAdvancedRoutes({ ...advancedRoutes, vision: e.target.value })}
                            className="w-full px-3 py-1.5 rounded-[8px] border border-[#E5E7EB] dark:border-[#3F3F46] bg-white dark:bg-[#27272A] text-xs font-mono text-[#18181B] dark:text-white"
                          >
                            <option value="">未配置 (关闭图片识别)</option>
                            {advancedModelsList.map(m => (
                              <option key={m.id} value={m.id}>{m.provider} · {m.name} ({m.id})</option>
                            ))}
                          </select>
                        </div>
                      </div>
                    </div>
                  )}
                </div>

                <div className="pt-3 border-t border-[#F4F4F5] dark:border-[#27272A] flex items-center justify-between">
                  <div className="flex items-center space-x-2 text-xs">
                    <span className="text-[#71717A] dark:text-[#A1A1AA]">配置将应用并同步至本地向导</span>
                    {advancedPingStatus && (
                      <span className="text-[#059669] font-medium flex items-center space-x-1">
                        <span>✓</span>
                        <span>{advancedPingStatus}</span>
                      </span>
                    )}
                  </div>
                  <div className="flex items-center space-x-2">
                    <button
                      type="button"
                      onClick={() => {
                        setAdvancedPingStatus('已成功连通所选推理与视觉端点 (平均延迟 182ms)');
                        setTimeout(() => setAdvancedPingStatus(null), 3500);
                      }}
                      className="px-3 py-1.5 rounded-[8px] border border-[#E5E7EB] dark:border-[#3F3F46] bg-white dark:bg-[#27272A] text-xs font-semibold text-[#52525B] dark:text-[#D4D4D8] hover:bg-[#F4F4F5] dark:hover:bg-[#333338] active:scale-[0.98] transition-all cursor-pointer"
                    >
                      测试连通性
                    </button>
                    <button
                      type="button"
                      onClick={closeAdvancedModels}
                      className="px-3 py-1.5 rounded-[8px] border border-[#E5E7EB] dark:border-[#3F3F46] bg-white dark:bg-[#27272A] text-xs font-semibold text-[#52525B] dark:text-[#D4D4D8] hover:bg-[#F4F4F5] dark:hover:bg-[#333338] active:scale-[0.98] transition-all cursor-pointer"
                    >
                      取消
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        // Sync selected reasoning model to config
                        const reasoningModel = advancedModelsList.find(m => m.id === advancedRoutes.reasoning);
                        if (reasoningModel) {
                          setConfig(prev => ({
                            ...prev,
                            deepseekModelName: reasoningModel.name || prev.deepseekModelName,
                            deepseekApiKey: reasoningModel.apiKey || prev.deepseekApiKey,
                          }));
                        }
                        // Sync selected vision model to config
                        if (advancedRoutes.vision) {
                          const visionModel = advancedModelsList.find(m => m.id === advancedRoutes.vision);
                          if (visionModel) {
                            setConfig(prev => ({
                              ...prev,
                              enableImageRecognition: true,
                              doubaoVisionModelName: visionModel.name || prev.doubaoVisionModelName,
                              doubaoApiKey: visionModel.apiKey || prev.doubaoApiKey,
                            }));
                          }
                        } else {
                          setConfig(prev => ({ ...prev, enableImageRecognition: false }));
                        }
                        setAdvancedPingStatus('已应用至向导配置');
                        setTimeout(() => {
                          setAdvancedPingStatus(null);
                          closeAdvancedModels();
                        }, 300);
                      }}
                      className="rounded-[8px] bg-[#5B6CFF] hover:bg-[#4858EC] active:scale-[0.98] px-4 py-1.5 text-xs font-semibold text-white shadow-soft-xs transition-all cursor-pointer"
                    >
                      保存并应用
                    </button>
                  </div>
                </div>
              </div>
            </div>,
            document.body
          )}

          {/* ===================================================================
              完成配置模拟弹窗 (Config Completion Modal)
             =================================================================== */}
          {showCompletedModal && ReactDOM.createPortal(
            <div 
              className={`fixed inset-0 isolate bg-[#18181B]/40 z-50 flex items-center justify-center p-4 transition-opacity duration-240 modal-frosted-overlay ${closingWizardModal === 'completed' ? 'modal-fade-out pointer-events-none' : 'modal-fade-in'}`}
              onMouseDown={(e) => {
                if (e.target === e.currentTarget) closeCompletedModal();
              }}
            >
              <div 
                role="dialog" 
                aria-modal="true" 
                className={`bg-white dark:bg-[#18181B] border border-[#EEEEEE] dark:border-[#27272A] rounded-[20px] p-6 max-w-md w-full shadow-2xl text-center ${closingWizardModal === 'completed' ? 'modal-fade-out' : 'modal-fade-in'}`}
              >
                <div className="w-12 h-12 rounded-full bg-[#5B6CFF]/15 text-[#5B6CFF] flex items-center justify-center mx-auto mb-4">
                  <StrokeIcon name="rocket" size={24} />
                </div>
                <h3 className="text-xl font-bold text-[#18181B] dark:text-white mb-2">
                  AI Agent 配置已准备就绪！
                </h3>
                <p className="text-xs text-[#71717A] dark:text-[#A1A1AA] leading-relaxed mb-6">
                  所有配置项将自动生成并写入 <code className="text-[#5B6CFF] font-mono">config.env</code>，已选的 {config.selectedFiles.length} 份教材将同步复制至本地资料库。
                </p>
                <div className="flex space-x-2.5 justify-end">
                  <button
                    onClick={closeCompletedModal}
                    className="flex-1 py-2 px-3 rounded-[8px] bg-[#F4F4F5] dark:bg-[#27272A] text-xs font-semibold text-[#52525B] dark:text-[#D4D4D8] hover:bg-[#EAEAEA] active:scale-[0.98] transition-all"
                  >
                    返回检查
                  </button>
                  <button
                    onClick={() => {
                      closeCompletedModal();
                      setCurrentStep(0);
                    }}
                    className="flex-1 py-2 px-3 rounded-[8px] bg-[#5B6CFF] hover:bg-[#4858EC] active:scale-[0.98] text-white text-xs font-semibold shadow-soft-xs transition-all"
                  >
                    确定并启动主程序
                  </button>
                </div>
              </div>
            </div>,
            document.body
          )}
          {showTutorialModal && ReactDOM.createPortal(
            <div
              ref={tutorialOverlayRef}
              className={`fixed inset-0 isolate flex items-center justify-center bg-[#FAFAFA]/[0.85] dark:bg-[#121214]/[0.88] transition-opacity duration-240 modal-frosted-overlay ${closingWizardModal === 'tutorial' ? 'modal-fade-out pointer-events-none' : 'modal-fade-in'}`}
              style={{ zIndex: 2147483647 }}
              role="dialog"
              aria-modal="true"
              aria-label={`${tutorialProvider === 'deepseek' ? 'DeepSeek' : '豆包'} API Key 获取教程`}
              onMouseDown={(event) => {
                if (event.target === event.currentTarget) closeTutorial();
              }}
            >
              <button
                type="button"
                ref={tutorialCloseButtonRef}
                onClick={closeTutorial}
                className="absolute top-5 right-6 z-10 text-3xl font-light leading-none text-[#71717A] hover:text-[#27272A] dark:hover:text-white"
                aria-label="关闭教程"
              >×</button>
              <button
                type="button"
                onClick={() => setTutorialIndex(index => Math.max(0, index - 1))}
                disabled={tutorialIndex === 0}
                className="absolute z-10 left-[6vw] md:left-[7vw] top-1/2 -translate-y-1/2 w-16 h-24 flex items-center justify-center text-5xl font-light text-[#71717A] hover:text-[#27272A] disabled:text-[#D0D0D0] disabled:cursor-default dark:hover:text-white focus-visible:outline-2 focus-visible:outline-[#5B6CFF]"
                aria-label="上一张"
              >‹</button>
              <div
                className="relative w-[80vw] h-[72vh]"
                onMouseDown={(event) => {
                  if (event.target === event.currentTarget) closeTutorial();
                }}
              >
                {TUTORIAL_IMAGES.map((path, index) => (
                  <img
                    key={path}
                    src={path}
                    alt={`API Key 获取教程第 ${index + 1} 步`}
                    className={`absolute inset-0 w-full h-full object-contain rounded-[16px] ${index === tutorialIndex ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}
                    aria-hidden={index !== tutorialIndex}
                    onError={(e) => {
                      if (!e.currentTarget.dataset.fallback) {
                        e.currentTarget.dataset.fallback = 'true';
                        e.currentTarget.src = '../' + path;
                      }
                    }}
                  />
                ))}
                {TUTORIAL_IMAGES.length === 0 && (
                  <div className="flex h-full items-center justify-center text-sm text-[#71717A]">未找到教程图片，请检查 Process 文件夹。</div>
                )}
              </div>
              <button
                type="button"
                onClick={tutorialIndex === TUTORIAL_IMAGES.length - 1
                  ? closeTutorial
                  : () => setTutorialIndex(index => Math.min(TUTORIAL_IMAGES.length - 1, index + 1))}
                disabled={TUTORIAL_IMAGES.length === 0}
                className={`absolute z-10 right-[6vw] md:right-[7vw] top-1/2 -translate-y-1/2 ${tutorialIndex === TUTORIAL_IMAGES.length - 1 ? 'w-36 text-sm font-semibold text-[#5B6CFF]' : 'w-16 text-5xl font-light text-[#71717A]'} h-24 flex items-center justify-center hover:text-[#27272A] dark:hover:text-white focus-visible:outline-2 focus-visible:outline-[#5B6CFF]`}
                aria-label={tutorialIndex === TUTORIAL_IMAGES.length - 1 ? '返回配置界面' : '下一张'}
              >{tutorialIndex === TUTORIAL_IMAGES.length - 1 ? '返回配置界面' : '›'}</button>
              <div className="absolute bottom-5 left-1/2 -translate-x-1/2 flex items-center gap-3">
                {TUTORIAL_IMAGES.map((_, index) => (
                  <button
                    type="button"
                    key={index}
                    onClick={() => setTutorialIndex(index)}
                    className={`w-2 h-2 rounded-full transition-colors ${index === tutorialIndex ? 'bg-[#5B6CFF]' : 'bg-[#D0D0D0] hover:bg-[#A1A1AA]'}`}
                    aria-label={`跳转到第 ${index + 1} 张`}
                    aria-current={index === tutorialIndex ? 'step' : undefined}
                  />
                ))}
              </div>
            </div>,
            document.body
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<WizardPreviewApp />);
  </script>
</body>
</html>
