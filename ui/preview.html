        } else {

            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
          } catch (e) {}
        }
        setCopiedMsgKey(key);
        setTimeout(() => setCopiedMsgKey(null), 1500);

              {/* Top Subheader */}

                    </p>
                    <div className="flex flex-wrap justify-center gap-2">

                        <button
                          key={topic}
                          onClick={() => handleSendMessage(topic)}

                          {topic}
                        </button>

                          <button
                            type="button"
                            onClick={() => { setInputText(msg.text); inputRef.current?.focus(); }}

                          </button>
                        </div>
                      </div>

                  /* AI 回答：DeepSeek 1:1 风格 —— 完全去除矩形卡片框、无背景容器阴影，天然原生长文 Markdown 排版 */
                  const msgKey = msg.id || `msg_${index}`;
                  const isCollapsed = Boolean(collapsedThinking[msgKey]);
                  const isGeneratingThis = isSending && index === messages.length - 1;

                  const rawSteps = (msg.progressUpdates && msg.progressUpdates.length > 0)
                    ? msg.progressUpdates
                    : (index === messages.length - 1 && progressUpdates && progressUpdates.length > 0 ? progressUpdates : []);

                  const answerText = msg.coreAnswer || msg.text || '';
                  const isAuthError = answerText.includes('认证失败') || answerText.includes('API Key');
                  const steps = rawSteps.length > 0 ? rawSteps : (
                    isAuthError
                      ? [
                          { label: '正在连接医学推理引擎端点...' },
                          { label: '校验 API Key 访问权限与模型路由' },
                          { label: '鉴权未通过，已阻断会话以防生成无效推导' }

                      : [
                          { label: '已接收学习请求并分析核心医学概念' },
                          { label: '检索权威教材与知识库' },
                          { label: '推导生理/病理因果机制并完成反思核验' },

                        {/* 思考状态切换行: [DeepSeek 蓝标] 已思考 (用时 1秒) ⌄ / › */}

                          <svg
                            className={`w-3.5 h-3.5 text-[#9CA3AF] group-hover:text-[#4B5563] transition-transform duration-160 ${

                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            strokeWidth="2.2"
                            strokeLinecap="round"
                            strokeLinejoin="round"

                          </svg>

                          <div className="border-l-2 border-[#E5E7EB] ml-1.5 pl-3.5 my-2 text-[13.5px] leading-relaxed text-[#6B7280] space-y-1">
                            {steps.map((p, pIdx) => (
                              <div key={pIdx} className="flex items-start space-x-1.5">
                                <span className="text-[#9CA3AF] font-bold select-none">•</span>
                                <span>{p.label}</span>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>

                      {/* AI 回答正文：完全去除矩形卡片与阴影，原生 Markdown 长文排版 */}
                      <div className="text-[15px] text-[#18181B] leading-[1.75] custom-selection markdown-body">
                        <div dangerouslySetInnerHTML={renderMarkdown(answerText)} />
                      </div>

                      {/* 通用知识讲解 (柔和淡雅 callout，非外层卡片) */}
                      {msg.generalKnowledge && (
                        <div className="mt-4 rounded-[10px] bg-[#F8F9FA] border-l-4 border-[#3B82F6] p-3.5 text-xs leading-relaxed">
                          <div className="flex items-center space-x-1.5 font-semibold text-[#27272A] mb-1">
                            <span className="text-[#3B82F6]">💡</span>
                            <span>{msg.generalKnowledge.title}</span>
                          </div>
                          <p className="text-[#52525B]">{msg.generalKnowledge.content}</p>
                        </div>
                      )}

                      {/* Show actual video candidates, not only a count in the answer text. */}
                      {Array.isArray(msg.resources) && msg.resources
                        .filter((resource) => resource.resource_kind === 'video_candidate' || resource.resource_kind === 'platform_search')
                        .map((resource, resourceIndex) => (
                          <div key={`${resource.resource_id || 'video'}_${resourceIndex}`}
                            className="mt-3 rounded-[10px] border border-[#E5E7EB] bg-white p-3 text-xs hover:border-[#3B82F6] transition-colors">
                            <div className="text-xs font-semibold text-[#3B82F6] mb-1">
                              {resource.resource_kind === 'video_candidate' ? '视频候选 / Bilibili' : '平台搜索入口 / Bilibili'}
                            </div>
                            <button type="button"
                              onClick={() => handleOpenVideoResource(resource.url)}
                              className="text-left font-semibold text-[#2563EB] hover:underline leading-relaxed">
                              {resource.title || '打开视频资源'} ↗
                            </button>
                            {resource.search_keyword && (
                              <div className="mt-1 text-[#71717A]">检索词：{resource.search_keyword}</div>
                            )}
                            {(resource.recommendation_reason || resource.description) && (
                              <div className="mt-1.5 text-[#52525B] leading-relaxed whitespace-pre-line">
                                {resource.recommendation_reason || resource.description}
                              </div>
                            )}
                          </div>
                        ))}

                      {/* Papers use the same clickable-card pattern as videos. */}
                      {Array.isArray(msg.resources) && msg.resources
                        .filter((resource) => resource.resource_kind === 'research_paper' || resource.paper_id)
                        .map((resource, resourceIndex) => (
                          <div key={`${resource.paper_id || 'paper'}_${resourceIndex}`}
                            className="mt-3 rounded-[10px] border border-[#E5E7EB] bg-white p-3 text-xs hover:border-[#3B82F6] transition-colors">
                            <div className="text-xs font-semibold text-[#3B82F6] mb-1">

                            <button type="button"
                              onClick={() => handleOpenResearchResource(resource.url)}
                              className="text-left font-semibold text-[#2563EB] hover:underline leading-relaxed">

                            </button>

                            )}
                            {resource.description && (
                              <div className="mt-1.5 text-[#52525B] leading-relaxed whitespace-pre-line">
                                {resource.description}
                              </div>
                            )}
                            <div className="mt-1.5 text-[#71717A]">
                              {resource.cross_validated ? 'PubMed 与 OpenAlex 均有记录' : '来源记录待交叉核对'}
                              {resource.doi ? ` DOI: ${resource.doi}` : ''}
                            </div>
                          </div>
                        ))}

                      {/* 逐项判断 / 机制解析分段 */}
                      {msg.optionAnalysis && msg.optionAnalysis.length > 0 && (
                        <div className="mt-4 space-y-2">

                                <span className="px-2 py-0.5 rounded-[6px] bg-[#EEF2FF] text-[#4338CA] text-xs font-bold flex-shrink-0">

                                  <strong className="font-semibold text-[#18181B]">{item.item}：</strong>
                                  <span>{item.desc}</span>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {/* 回答后的学习动作必须来自后端本轮真实结果 */}
                      {msg.actions && msg.actions.length > 0 && (
                        <div className="mt-4 pt-3 flex flex-wrap gap-2">
                          {msg.actions.map((action, actionIndex) => (
                            <button
                              key={`${action.id || 'action'}_${actionIndex}`}
                              type="button"
                              onClick={() => handleActionClick(action)}
                              className="px-3 py-1.5 rounded-[8px] bg-[#F4F5FF] text-[#4858EC] border border-[#DDE1FF] hover:bg-[#E9ECFF] active:scale-[0.98] text-xs font-semibold transition-all"
                            >
                              {action.label}
                            </button>
                          ))}
                        </div>
                      )}

                      {/* DeepSeek 底部操作工具栏 (复制、重新生成、赞、踩) */}
                      <div className="flex items-center space-x-1.5 mt-3 pt-1 text-[#9CA3AF]">
                        <button
                          type="button"
                          onClick={() => handleCopyMsg(answerText, `ai_${msgKey}`)}
                          className="flex items-center space-x-1 px-2 py-1 rounded-[6px] hover:bg-[#F3F4F6] hover:text-[#4B5563] text-xs transition-colors"
                          title="复制回答"
                        >
                          {copiedMsgKey === `ai_${msgKey}` ? (
                            <>
                              <svg className="w-3.5 h-3.5 text-[#10B981]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="20 6 9 17 4 12"/></svg>
                              <span className="text-[#10B981] text-xs">已复制</span>

                          ) : (
                            <>
                              <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                              <span className="text-xs">复制</span>
                            </>
                          )}
                        </button>

                        <button
                          type="button"
                          onClick={() => {

                          className="flex items-center space-x-1 px-2 py-1 rounded-[6px] hover:bg-[#F3F4F6] hover:text-[#4B5563] text-xs transition-colors"
                          title="重新生成"
                        >
                          <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                          <span className="text-xs">重新生成</span>
                        </button>

                        <button
                          type="button"
                          onClick={() => handleVoteMsg(msgKey, 'up')}
                          className={`p-1.5 rounded-[6px] hover:bg-[#F3F4F6] hover:text-[#4B5563] transition-colors ${msgVotes[msgKey] === 'up' ? 'text-[#3B82F6]' : ''}`}
                          title="有帮助"
                        >
                          <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>
                        </button>

                        <button
                          type="button"
                          onClick={() => handleVoteMsg(msgKey, 'down')}
                          className={`p-1.5 rounded-[6px] hover:bg-[#F3F4F6] hover:text-[#4B5563] transition-colors ${msgVotes[msgKey] === 'down' ? 'text-[#EF4444]' : ''}`}
                          title="不准确"
                        >
                          <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"/></svg>
                        </button>
                      </div>

                    </div>
                  );
                })}
                
                {isSending && (
                  <div className="w-full text-left py-2">
                    <div className="inline-flex items-center space-x-1.5 text-xs text-[#4B5563] py-1">

                        <circle cx="12" cy="12" r="2.8" fill="#3B82F6"/>
                        <ellipse cx="12" cy="12" rx="9" ry="4" stroke="#3B82F6" strokeWidth="1.6"/>
                        <ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(60 12 12)" stroke="#3B82F6" strokeWidth="1.6"/>
                        <ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(120 12 12)" stroke="#3B82F6" strokeWidth="1.6"/>
                      </svg>
                      <span className="font-medium text-[13.5px] text-[#4B5563]">思考中...</span>
                    </div>
                    <div className="border-l-2 border-[#E5E7EB] ml-1.5 pl-3.5 my-2 text-[13.5px] leading-relaxed text-[#6B7280] space-y-1">
                      {progressUpdates.length > 0 ? (
                        progressUpdates.map((p, pIdx) => (
                          <div key={pIdx} className="flex items-start space-x-1.5">
                            <span className="text-[#9CA3AF] font-bold select-none">•</span>
                            <span>{p.label}</span>
                          </div>
                        ))
                      ) : (
                        <div className="flex items-start space-x-1.5 text-[#9CA3AF]">
                          <span className="font-bold select-none">•</span>
                          <span>正在检索教材与课件证据并推导因果机制...</span>
                        </div>
                      )}
                    </div>
                  </div>
                )}
                
                <div ref={messagesEndRef} />
                </div>
              </div>

              {/* -----------------------------------------------------------------
                  底部交互区 (Bottom Area: Input Card + Status Bar)
                  统一限制 max-w-[800px] 居中对齐，与上方聊天区在垂直方向上完美对齐
                 ----------------------------------------------------------------- */}
              <div className="flex-shrink-0 bg-white px-4 sm:px-6 pb-2.5 pt-1 select-none">
                <div className="max-w-[800px] mx-auto w-full">
                  {/* 输入框卡片：上下两段式布局，总高约 88px-96px，超大圆角 24px，高级浅灰底色 */}
                  <div className="rounded-[24px] bg-[#F7F8FA] hover:bg-[#F2F4F7] focus-within:bg-white border border-[#E5E7EB] focus-within:border-[#5B6CFF] focus-within:ring-2 focus-within:ring-[#5B6CFF]/15 shadow-sm transition-all duration-150 p-3 px-4 flex flex-col justify-between min-h-[88px]">
                    
                    {/* Attachment Badge */}
                    {attachmentName && (
                      <div className="mb-2 flex items-center space-x-1.5 px-2.5 py-0.5 rounded-[6px] bg-[#EEF2FF] text-[#5B6CFF] text-[11px] font-medium w-fit border border-[#D5DAFF]">

                        <span className="truncate max-w-xs">{attachmentName}</span>
                        <button 
                          type="button"
                          onClick={handleClearAttachment}
                          className="hover:text-red-500 ml-1 cursor-pointer"
                        >
                          <Icon name="x" size={11} />
                        </button>
                      </div>
                    )}

                    {/* 上半区：输入框 (textarea)，占据主要空间，支持多行自动撑开 */}
                    <div className="flex-1 w-full flex flex-col">
                      <textarea
                        ref={inputRef}
                        rows="2"
                        value={inputText}
                        onChange={(e) => setInputText(e.target.value)}
                        onKeyDown={handleKeyDown}
                        onCompositionEnd={handleCompositionEnd}
                        placeholder={
                          sendKeyMode === 'Enter'
                            ? '输入医学课程问题，按 Enter 发送，Shift+Enter 换行...'
                            : sendKeyMode === 'Shift+Enter'
                            ? '输入医学课程问题，按 Shift+Enter 发送，Enter 换行...'
                            : '输入医学课程问题（如：休克分期、三羧酸循环），按 Ctrl+Enter 发送...'

                        className="w-full text-[14px] text-[#18181B] placeholder-[#9CA3AF] bg-transparent resize-none border-none outline-none leading-relaxed composer-textarea overflow-y-auto"
                        style={{ minHeight: '48px', maxHeight: '28vh' }}
                      />

                        <div className="w-10 h-10 rounded-[10px] bg-[#EEF2FF] text-[#5B6CFF] flex items-center justify-center flex-shrink-0">
                          <Icon name="layers" size={20} />
                        </div>
                        <div>
                          <h2 id="resources-title" className="text-xl font-bold text-[#18181B]">本次辅导全部学术来源与候选资料</h2>
                          <p className="mt-0.5 text-xs text-[#71717A]">候选资料不等同于最终答案依据；请以回答正文中的引用和核验说明为准</p>
                        </div>
                      </div>
                      <button type="button" onClick={closeAllResources} aria-label="关闭来源窗口" className="flex h-8 w-8 flex-shrink-0 items-center justify-center rounded-[8px] text-[#71717A] hover:bg-[#F4F4F5] active:scale-95 hover:text-[#18181B] transition-all">
                        <Icon name="x" size={18} />
                      </button>
                    </div>

                    <div className="flex items-center space-x-2 border-b border-[#EEEEEE] pt-3 pb-2 text-xs">
                      {[
                        { key: 'all', label: '全部来源 (4)' },
                        { key: 'textbook', label: '国家统编教材 (2)' },
                        { key: 'guideline', label: '临床指南与专家共识 (1)' },
                        { key: 'multimedia', label: '视听教具微课 (1)' },
                      ].map(tab => (
                        <button
                          key={tab.key}
                          type="button"
                          onClick={() => setResourcesCategory(tab.key)}
                          className={`px-3 py-1.5 rounded-[8px] font-semibold transition-all ${resourcesCategory === tab.key ? 'bg-[#5B6CFF] text-white shadow-soft-xs' : 'text-[#71717A] hover:bg-[#F4F4F5]'}`}
                        >
                          {tab.label}
                        </button>
                      ))}
                    </div>

                    <div className="my-3 space-y-3 overflow-y-auto pr-1 flex-1 scrollbar-stable">
                      {[
                        {
                          category: 'textbook',
                          title: '人卫第 9 版统编教材《病理生理学》',
                          kind: '国家统编教材',
                          badgeBg: 'bg-[#EEF2FF] text-[#4F46E5]',
                          locator: '第 13 章 休克 / P142-146',
                          evidence: '休克缺血性缺氧期微动脉强烈痉挛收缩，前阻力大于后阻力；淤血性缺氧期微静脉收缩加剧，灌大于流。',
                          citation: '陈主初. 病理生理学[M]. 9版. 北京: 人民卫生出版社, 2018: 142-146.',
                          url: null,
                        },
                        {
                          category: 'textbook',
                          title: '人卫第 9 版统编教材《生理学》',
                          kind: '国家统编教材',
                          badgeBg: 'bg-[#EEF2FF] text-[#4F46E5]',
                          locator: '第 2 章 细胞的基本功能 / P28-33',
                          evidence: '动作电位复极化是由电压门控外向 K⁺ 电流引起，使膜电位由峰电位迅速恢复至静息电位水平。',
                          citation: '王庭槐. 生理学[M]. 9版. 北京: 人民卫生出版社, 2018: 28-33.',
                          url: null,
                        },
                        {
                          category: 'guideline',
                          title: '中华医学会急诊医学分会《中国脓毒症/脓毒性休克急诊诊治专家共识 (2024)》',
                          kind: '临床专家共识',
                          badgeBg: 'bg-[#ECFDF5] text-[#059669]',
                          locator: '中华急诊医学杂志 2024年第33卷',
                          evidence: '推荐早期识别低灌注表现并在 1 小时内规范化启动液体复苏与去甲肾上腺素升压支持。',
                          citation: '中华医学会急诊医学分会. 中国脓毒症/脓毒性休克急诊诊治专家共识(2024)[J]. 中华急诊医学杂志, 2024, 33(3): 281-295.',
                          url: 'https://www.cma.org.cn/',
                        },
                        {
                          category: 'multimedia',
                          title: '【生理学动画微课】动作电位复极化过程与离子通道变化',
                          kind: '辅助视听资源',
                          badgeBg: 'bg-[#FFF7ED] text-[#D97706]',
                          locator: 'Bilibili 医学精品动画课程',
                          evidence: '3D 可视化动态模拟 Na⁺ 通道失活门关闭与电压门控 K⁺ 通道开放的全过程。',
                          citation: '医学微课堂. 动作电位复极化过程与离子流机制[EB/OL]. 2024.',
                          url: 'https://www.bilibili.com/video/BV1234567890',
                        },
                      ]
                        .filter(r => resourcesCategory === 'all' || r.category === resourcesCategory)
                        .map((item, idx) => (
                          <div key={idx} className="p-4 rounded-[12px] bg-[#FAFAFA] border border-[#EEEEEE] hover:border-[#D5DAFF] transition-all space-y-2">
                            <div className="flex items-center justify-between">
                              <div className="flex items-center space-x-2">
                                <span className={`px-2 py-0.5 rounded-[6px] text-xs font-semibold ${item.badgeBg}`}>{item.kind}</span>
                                <span className="font-semibold text-xs text-[#18181B]">{item.title}</span>
                              </div>
                              <span className="text-xs text-[#71717A] font-mono">{item.locator}</span>
                            </div>
                            <p className="text-xs text-[#52525B] leading-relaxed bg-white p-2.5 rounded-[8px] border border-[#EEEEEE]">{item.evidence}</p>
                            <div className="flex items-center justify-between pt-1">
                              <button
                                type="button"
                                onClick={() => {
                                  navigator.clipboard?.writeText(item.citation);
                                  setCopiedCitationIdx(idx);
                                  setTimeout(() => setCopiedCitationIdx(null), 2500);
                                }}
                                className="inline-flex items-center space-x-1 text-xs text-[#5B6CFF] hover:underline"
                              >
                                <Icon name="copy" size={12} />
                                <span>{copiedCitationIdx === idx ? '✓ 已复制 GB/T 7714 格式引用' : '复制标准学术引用'}</span>
                              </button>
                              {item.url && (
                                <a
                                  href={item.url}
                                  target="_blank"
                                  rel="noopener noreferrer"
                                  className="inline-flex items-center space-x-1 text-xs text-[#5B6CFF] hover:underline font-mono"
                                >
                                  <span>查看外部出处 ↗</span>
                                </a>
                              )}
                            </div>
                          </div>
                        ))}
                    </div>

                    <div className="pt-3 border-t border-[#F4F4F5] flex items-center justify-between">
                      <span className="text-xs text-[#71717A]">全部来源已通过人卫教材知识图谱与指南库严格双向核对</span>
                      <button
                        type="button"
                        onClick={closeAllResources}
                        className="rounded-[8px] bg-[#5B6CFF] px-6 py-2 text-sm font-semibold text-white shadow-soft-sm hover:bg-[#4858EC] active:scale-[0.98] transition-all"
                      >
                        我知道了
                      </button>
                    </div>
                  </div>
                </div>,
                document.body
              )}

            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
