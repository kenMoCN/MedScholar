      { code: 'guided', name: '伙伴引导模式' },
      { code: 'socratic', name: '苏格拉底启发' },
      { code: 'research', name: '科研模式拓展' },
    ];

    const MODE_HELP_QUESTION = '动作电位为什么会复极化？';
    const MODE_GUIDE = {
      auto: {
        description: '系统先判断你是在做题、补概念，还是想继续深挖，再选择合适的讲解深度。遇到信息不足的问题，会先确认关键条件，而不是机械套用一种回答格式。',
        scenario: '不确定该选哪种模式，或一次对话里既要做题又要理解原理时。',
        example: '复极化的关键是膜对 K⁺ 的通透性增大，K⁺ 外流使膜电位回落；同时 Na⁺ 通道逐渐失活。若你正在做选择题，我会先帮你定位选项；若是在复习概念，我们可以接着画一条膜电位变化的时间线。',
      },
      quick: {
        description: '先给结论，再用最少的步骤解释关键机制和易错点。它适合需要快速核对答案的时刻，但不会跳过决定对错的重要条件。',
        scenario: '刷题、考前复习，或已经熟悉基础概念只想确认结论时。',
        example: '主要因为电压门控 K⁺ 通道开放，K⁺ 外流增加，膜电位向静息水平回落；Na⁺ 通道失活也让内向 Na⁺ 电流减弱。注意：复极化不是 Na⁺ 大量外流。',
      },
      guided: {
        description: '像学习伙伴一样，先听你卡在哪里，再拆成几个容易理解的小步。可以用类比、举例或换一种说法，直到你能把机制自己讲出来。',
        scenario: '上完课仍觉得抽象，或看过标准答案却没有真正理解时。',
        example: '把膜想成一扇有两类门的房间：去极化时 Na⁺ 的门先打开；到峰值附近，这扇门逐渐关上，K⁺ 的门打开，正电荷随 K⁺ 离开细胞，膜内就重新变得相对负。我们可以再对照动作电位曲线，把这一步标出来。',
      },
      socratic: {
        description: '先用一两个有方向的问题帮你自己推出答案，再根据你的回答补齐遗漏。重点是训练推理过程，而不只是记住一句结论；需要时也可以直接要求公布答案。',
        scenario: '想检验自己是否真的会推，或希望有人带着你一步步思考时。',
        example: '先想一想：动作电位到达峰值后，Na⁺ 通道和 K⁺ 通道各发生了什么？如果正电荷主要随 K⁺ 离开细胞，膜内电位会朝哪个方向变化？你先说说自己的判断，我再帮你核对。',
      },
      research: {
        description: '在讲清课程结论后，再把问题延伸到研究方法、证据和进一步阅读。论文是拓展视野的材料，不会替代你的教材，也不会把尚未核验的检索结果说成定论。',
        scenario: '准备科研汇报、想看机制研究，或希望从课堂知识走向论文时。',
        example: '课程层面的答案是 K⁺ 外流增强与 Na⁺ 通道失活共同推动复极化。若往科研层面追问，可以比较不同电压门控 K⁺ 通道的开放动力学，以及膜片钳实验如何区分内向和外向电流；需要的话，再检索相关综述和原始研究。',
      },
    };

    const HORIZON_OPTIONS = [
      { code: 'research_mode_only', name: '仅科研模式拓展' },
      { code: 'all_answers', name: '每次答题均拓展' },
      { code: 'off', name: '关闭论文拓展' },
    ];

    function App() {
      const [sessions, setSessions] = useState([]);
      const [currentSessionId, setCurrentSessionId] = useState('');
      const [messages, setMessages] = useState([]);
      const [inputText, setInputText] = useState('');
      const [isSending, setIsSending] = useState(false);
      const [attachmentName, setAttachmentName] = useState('');
      const [statusText, setStatusText] = useState('准备就绪');
      const [sourcesCount, setSourcesCount] = useState(2);
      // Detect desktop Qt environment immediately from UA or window.qt
      const isQtEnv = typeof navigator !== 'undefined' && (
        navigator.userAgent.includes('QtWebEngine') || 
        Boolean(window.qt && window.qt.webChannelTransport)
      );
      const [isDesktop, setIsDesktop] = useState(isQtEnv);
      const [framelessMode, setFramelessMode] = useState(false);
      
      // Top bar pill states
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      const [subjectCode, setSubjectCode] = useState('auto');
      const [modeCode, setModeCode] = useState('auto');
      const [horizonCode, setHorizonCode] = useState('research_mode_only');
      const [focusMode, setFocusMode] = useState(false);
      const [processOpen, setProcessOpen] = useState(false);
      const [progressUpdates, setProgressUpdates] = useState([]);
      const [pendingApproval, setPendingApproval] = useState(null);

      // Research filter states inside drawer
      const [paramsDrawerOpen, setParamsDrawerOpen] = useState(false);
      const [researchStudyType, setResearchStudyType] = useState('自动判断');
      const [researchYearFrom, setResearchYearFrom] = useState('自动');
      const [researchYearTo, setResearchYearTo] = useState('自动');

      // Dropdown toggle states
      const [activeDropdown, setActiveDropdown] = useState(null);
      const [modeHelpOpen, setModeHelpOpen] = useState(false);
      const [aboutOpen, setAboutOpen] = useState(false);
      const modeHelpTriggerRef = useRef(null);
      const modeHelpCloseRef = useRef(null);
      const modeHelpDialogRef = useRef(null);

      const openModeHelp = (event) => {
        event.preventDefault();
        event.stopPropagation();
        setActiveDropdown(null);
        setModeHelpOpen(true);
      };
      const closeModeHelp = () => setModeHelpOpen(false);

      useEffect(() => {
        if (!modeHelpOpen) return;
        const focusTimer = window.setTimeout(() => modeHelpCloseRef.current?.focus(), 0);
        const onKeyDown = (event) => {
          if (event.key === 'Escape') {
            event.preventDefault();
            event.stopPropagation();
            closeModeHelp();
          } else if (event.key === 'Tab') {
            const buttons = Array.from(modeHelpDialogRef.current?.querySelectorAll('button:not([disabled]), [tabindex="0"]') || []);
            if (!buttons.length) return;
            if (event.shiftKey && document.activeElement === buttons[0]) {
              event.preventDefault();
              buttons[buttons.length - 1].focus();
            } else if (!event.shiftKey && document.activeElement === buttons[buttons.length - 1]) {
              event.preventDefault();
              buttons[0].focus();
            }
          }
        };
        window.addEventListener('keydown', onKeyDown, true);
        return () => {
          window.clearTimeout(focusTimer);
          window.removeEventListener('keydown', onKeyDown, true);
          modeHelpTriggerRef.current?.focus();
        };
      }, [modeHelpOpen]);

      useEffect(() => {
        if (!aboutOpen) return;
        const closeOnEscape = (event) => {
          if (event.key === 'Escape') setAboutOpen(false);
        };
        window.addEventListener('keydown', closeOnEscape);
        return () => window.removeEventListener('keydown', closeOnEscape);
      }, [aboutOpen]);

      // Send Shortcut Mode: Enter, Ctrl+Enter, Shift+Enter
      const SEND_MODES = [
        { key: 'Enter', label: 'Enter 发送', hint: 'Shift + Enter 换行' },
        { key: 'Ctrl+Enter', label: 'Ctrl + Enter 发送', hint: 'Enter 换行' },
        { key: 'Shift+Enter', label: 'Shift + Enter 发送', hint: 'Enter 换行' },
      ];
      const [sendKeyMode, setSendKeyMode] = useState(() => {
        try {
          // Reset the prior version's default once; remember future choices.
          return localStorage.getItem('medscholar_send_key_mode_v3') || 'Enter';
        } catch (e) {
          return 'Enter';
        }
      });
      const [sendModeDropdownOpen, setSendModeDropdownOpen] = useState(false);

      const handleSelectSendMode = (modeKey) => {
        setSendKeyMode(modeKey);
        setSendModeDropdownOpen(false);
        try {
          localStorage.setItem('medscholar_send_key_mode_v3', modeKey);
        } catch (e) {}
        if (window.pyBridge && window.pyBridge.setSendKeyMode) {
          window.pyBridge.setSendKeyMode(modeKey);
        }
        // The selected menu button is removed after closing the dropdown.
        // Return keyboard focus to the composer so the new shortcut works immediately.
        requestAnimationFrame(() => inputRef.current?.focus());
      };

      const messagesEndRef = useRef(null);
      const inputRef = useRef(null);

      const subjectLabel = SUBJECT_OPTIONS.find((s) => s.code === subjectCode)?.name || '自动识别学科';
      const modeLabel = MODE_OPTIONS.find((m) => m.code === modeCode)?.name || '智能选择';
      const horizonLabel = HORIZON_OPTIONS.find((h) => h.code === horizonCode)?.name || '仅科研模式拓展';

      const scrollToBottom = () => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      };

      useEffect(() => {
        scrollToBottom();
      }, [messages, isSending]);

      // Connect with PySide6 QWebChannel
      useEffect(() => {
        let pollTimer = null;
        let isConnected = false;

        const setupBridge = () => {
          if (isConnected) return true;
          if (window.qt && window.qt.webChannelTransport) {
            isConnected = true;
            setIsDesktop(true);
            new QWebChannel(window.qt.webChannelTransport, function(channel) {
              window.pyBridge = channel.objects.bridge;

              if (window.pyBridge.framelessModeChanged) {
                window.pyBridge.framelessModeChanged.connect(function(val) {
                  setFramelessMode(Boolean(val));
                });
              }
              if (window.pyBridge.themeChanged) {
                window.pyBridge.themeChanged.connect(function(theme) {
                  document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
                });
              }

              // 1. Sessions updated
              window.pyBridge.sessionsUpdated.connect(function(jsonStr) {
                try {
                  const list = JSON.parse(jsonStr);
                  setSessions(list);
                } catch (e) { console.error('sessionsUpdated err:', e); }
              });

              // 2. Session switched
              window.pyBridge.sessionSwitched.connect(function(sessId, msgsJson) {
                try {
                  setCurrentSessionId(sessId);
                  const msgs = JSON.parse(msgsJson);
                  setMessages(msgs);
                  setProgressUpdates([]);
                } catch (e) { console.error('sessionSwitched err:', e); }
              });

              // 3. Progress updated
              window.pyBridge.progressUpdated.connect(function(phase, label, status) {
                setProgressUpdates(prev => {
                  const idx = prev.findIndex(p => p.phase === phase);
                  const item = { phase, label, status };
                  if (idx >= 0) {
                    const copy = [...prev];
                    copy[idx] = item;
                    return copy;
                  }
                  return [...prev, item];
                });
              });

              // 4. Answer received
              window.pyBridge.answerReceived.connect(function(msgJson) {
                try {
                  const msg = JSON.parse(msgJson);
                  setMessages(prev => [...prev, msg]);
                  setIsSending(false);
                } catch (e) { console.error('answerReceived err:', e); }
              });

              // 5. Generating state changed
              window.pyBridge.generatingStateChanged.connect(function(busy) {
                setIsSending(busy);
                if (busy) {
                  setProgressUpdates([]);
                }
              });

              // 6. Status changed
              window.pyBridge.statusChanged.connect(function(text) {
                setStatusText(text);
              });

              // 7. Attachment changed
              window.pyBridge.attachmentChanged.connect(function(name) {
                setAttachmentName(name);
              });

              // 8. Subject / Mode / Horizon changed from Python
              window.pyBridge.subjectChanged.connect(function(code) {
                setSubjectCode(code);
              });
              window.pyBridge.modeChanged.connect(function(code) {
                setModeCode(code);
              });
              window.pyBridge.horizonChanged.connect(function(code) {
                setHorizonCode(code);
              });

              if (window.pyBridge.sidebarCollapsedChanged) {
                window.pyBridge.sidebarCollapsedChanged.connect(function(val) {
                  setSidebarCollapsed(Boolean(val));
                });
              }

              if (window.pyBridge.approvalRequested) {
                window.pyBridge.approvalRequested.connect(function(jsonStr) {
                  try {
                    setPendingApproval(JSON.parse(jsonStr));
                  } catch (e) {
                    console.error('approvalRequested err:', e);
                  }
                });
              }
              if (window.pyBridge.approvalCleared) {
                window.pyBridge.approvalCleared.connect(function() {
                  setPendingApproval(null);
                });
              }

              // Frontend initialized signal
              if (window.pyBridge.onFrontendReady) {
                window.pyBridge.onFrontendReady();
              }
            });
            return true;
          }
          return false;
        };

        if (!setupBridge()) {
          pollTimer = setInterval(() => {
            if (setupBridge() && pollTimer) {
              clearInterval(pollTimer);
              pollTimer = null;
            }
          }, 50);
        }

        return () => {
          if (pollTimer) clearInterval(pollTimer);
        };
      }, []);

      // Handlers
      const handleToggleSidebar = () => {
        setSidebarCollapsed((prev) => {
          const next = !prev;
          if (window.pyBridge && window.pyBridge.toggleSidebar) {
            window.pyBridge.toggleSidebar();
          }
          return next;
        });
      };

      const handleSendMessage = (textToSend) => {
        const query = (textToSend !== undefined ? textToSend : inputText).trim();
        if ((!query && !attachmentName) || isSending) return;

        const userMsg = {
          id: 'user_' + Date.now(),
          sender: 'user',
          text: query || (attachmentName ? `[图片题目: ${attachmentName}]` : ''),
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          attachment: attachmentName,
        };

        setMessages((prev) => [...prev, userMsg]);
        setInputText('');
        setIsSending(true);

        if (window.pyBridge && window.pyBridge.sendMessage) {
          window.pyBridge.sendMessage(query);
          return;
        }

        setIsSending(false);
        setStatusText('桌面问答服务尚未连接，请稍后重试');
        setMessages((prev) => prev.filter((item) => item.id !== userMsg.id));
      };

      const handleActionClick = (act) => {
        if (window.pyBridge && window.pyBridge.sendLearningAction) {
          window.pyBridge.sendLearningAction(act.id, act.label, act.prompt || act.label, act.topic || '');
        } else {
          handleSendMessage(`请帮我针对刚才的内容：${act.label}`);
        }
      };

      const handleApprovalDecision = (approved) => {
        if (window.pyBridge && window.pyBridge.resolveApproval) {
          window.pyBridge.resolveApproval(Boolean(approved));
          setPendingApproval(null);
          setStatusText(approved ? '已允许，继续识别图片' : '已取消本次图片识别');
        }
      };

      const handleKeyDown = (e) => {
        const isEnter = e.key === 'Enter' || e.key === 'Return' ||
          e.code === 'Enter' || e.code === 'NumpadEnter';
        if (!isEnter) return;

        // Qt WebEngine can report keyCode 229 for modified Enter even after
        // Chinese composition has ended. Only plain Enter needs that fallback.
        if (e.isComposing || e.nativeEvent?.isComposing ||
            (e.keyCode === 229 && !e.ctrlKey && !e.metaKey && !e.shiftKey)) {
          return;
        }

        if (sendKeyMode === 'Enter') {
          // Enter sends; Shift+Enter or Ctrl+Enter wraps new line
          if (!e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey) {
            e.preventDefault();
            handleSendMessage();
          }
        } else if (sendKeyMode === 'Ctrl+Enter') {
          // Ctrl+Enter or Cmd+Enter sends; Enter wraps
          if ((e.ctrlKey || e.metaKey) && !e.altKey) {
            e.preventDefault();
            handleSendMessage();
          }
        } else if (sendKeyMode === 'Shift+Enter') {
          // Shift+Enter sends; Enter wraps
          if (e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey) {
            e.preventDefault();
            handleSendMessage();
          }
        }
      };

      const handleNewConversation = () => {
        if (window.pyBridge && window.pyBridge.newConversation) {
          window.pyBridge.newConversation();
          return;
        }
        const newId = 's_' + Date.now();
        const newSession = {
          id: newId,
          title: '新医学讨论 ' + (sessions.length + 1),
          time: '刚刚',
          subject: subjectLabel === '自动识别学科' ? '临床综合' : subjectLabel,
        };
        setSessions([newSession, ...sessions]);
        setCurrentSessionId(newId);
        setMessages([]);
      };

      const handleSelectSession = (id) => {
        if (id === currentSessionId) return;
        if (window.pyBridge && window.pyBridge.selectSession) {
          window.pyBridge.selectSession(id);
        } else {
          setCurrentSessionId(id);
        }
      };

      const handleDeleteSession = (e, id) => {
        e.stopPropagation();
        if (window.pyBridge && window.pyBridge.deleteSession) {
          window.pyBridge.deleteSession(id);
        } else {
          if (sessions.length > 1) {
            setSessions(sessions.filter((item) => item.id !== id));
          }
        }
      };

      const handleChooseImage = () => {
        if (window.pyBridge && window.pyBridge.chooseImage) {
          window.pyBridge.chooseImage();
        } else {
          setAttachmentName('sample_slide_pathology.png');
        }
      };

      const handleClearAttachment = () => {
        if (window.pyBridge && window.pyBridge.clearAttachment) {
          window.pyBridge.clearAttachment();
        }
        setAttachmentName('');
      };

      const handleStopAnswer = () => {
        if (window.pyBridge && window.pyBridge.stopAnswer) {
          window.pyBridge.stopAnswer();
        } else {
          setIsSending(false);
        }
      };

      const handleOpenKnowledge = () => {
        if (window.pyBridge && window.pyBridge.openKnowledgeDialog) {
          window.pyBridge.openKnowledgeDialog();
        } else {
          alert('课程知识库：已接入人卫9版教材与课件索引。');
        }
      };

      const handleOpenSkills = () => {
        if (window.pyBridge && window.pyBridge.openSkillsDialog) {
          window.pyBridge.openSkillsDialog();
        } else {
          alert('纠错反馈与 Skill：已沉淀 12 项医学理解技能。');
        }
      };

      const handleOpenEvaluation = () => {
        if (window.pyBridge && window.pyBridge.openEvaluationDialog) {
          window.pyBridge.openEvaluationDialog();
        } else {
          alert('题库评测：已加载端到端执业医真题集。');
        }
      };

      const handleOpenOfficialSources = () => {
        if (window.pyBridge && window.pyBridge.openOfficialSources) {
          window.pyBridge.openOfficialSources();
        } else {
          alert('官方证据源：WHO、NICE、中国卫健委官方数据。');
        }
      };

      const handleOpenSettings = () => {
        if (window.pyBridge && window.pyBridge.openSettingsDialog) {
          window.pyBridge.openSettingsDialog();
        } else {
          alert('设置与模型配置：DeepSeek V3 / R1 / 视觉模型参数。');
        }
      };

      const handleOpenAllResources = () => {
        if (window.pyBridge && window.pyBridge.openAllResources) {
          window.pyBridge.openAllResources();
        } else {
          alert('已定位全部来源：\n1. 人卫9版《病理生理学》第13章 P142\n2. 临床休克诊疗专家共识 (2024)');
        }
      };

      const handleOpenVideoResource = (rawUrl) => {
        try {
          const url = new URL(rawUrl);
          const isVideo = url.hostname === 'www.bilibili.com' && url.pathname.startsWith('/video/BV');
          const isSearch = url.hostname === 'search.bilibili.com' && url.pathname === '/all';
          if (url.protocol !== 'https:' || (!isVideo && !isSearch)) return;
          if (window.pyBridge && window.pyBridge.openVideoResource) {
            window.pyBridge.openVideoResource(url.href);
          } else {
            window.open(url.href, '_blank', 'noopener,noreferrer');
          }
        } catch (_) {
          // Ignore malformed or untrusted resource URLs.
        }
      };

      const handleOpenResearchResource = (rawUrl) => {
        try {
          const url = new URL(rawUrl);
          if (url.protocol !== 'https:' || !url.hostname || url.username || url.password) return;
          if (window.pyBridge && window.pyBridge.openResearchResource) {
            window.pyBridge.openResearchResource(url.href);
          } else {
            window.open(url.href, '_blank', 'noopener,noreferrer');
          }
        } catch (_) {
          // Ignore malformed paper URLs rather than turning metadata into HTML.
        }
      };

      const handleWindowMinimize = () => {
        if (window.pyBridge && window.pyBridge.minimizeWindow) window.pyBridge.minimizeWindow();
      };
      const handleWindowMaximize = () => {
        if (window.pyBridge && window.pyBridge.maximizeWindow) window.pyBridge.maximizeWindow();
      };
      const handleWindowClose = () => {
        if (window.pyBridge && window.pyBridge.closeWindow) window.pyBridge.closeWindow();
      };

      const renderMarkdown = (content) => {
        if (!content) return '';
        if (window.marked && window.marked.parse) {
          return { __html: window.marked.parse(content) };
        }
        return { __html: `<p>${content.replace(/\n/g, '<br/>')}</p>` };
      };

      return (
        <div className="flex flex-col h-screen w-screen overflow-hidden bg-[#FAFAFA] font-sans text-[#18181B]">
          
          {/* =====================================================================
              1. 顶部细条 (Window Title & Window Controls)
                 当在桌面且非无边框模式时隐藏，避免与系统标题栏形成“套娃”
             ===================================================================== */}
          {(!isDesktop || framelessMode) && (
            <header 
              onMouseDown={(e) => {
                if (e.target.closest('button')) return;
                if (window.pyBridge && window.pyBridge.startWindowMove) {
                  window.pyBridge.startWindowMove();
                }
              }}
              style={{ WebkitAppRegion: 'drag' }}
              className="h-8 bg-[#FAFAFA] border-b border-[#EEEEEE] flex items-center justify-between px-3 text-xs text-[#71717A] select-none flex-shrink-0 z-30 cursor-default"
            >
              <div className="flex items-center space-x-2">
                <img 
                  src="logo.png" 
                  alt="Logo" 
                  onError={(e) => { e.target.src = 'web/assets/logo.png'; }}
                  className="w-3.5 h-3.5 rounded-[3px] object-cover flex-shrink-0" 
                />
                <span className="font-medium text-[#27272A] tracking-tight">MedScholar</span>
                <span className="text-[10px] text-[#A1A1AA] px-1.5 py-0.5 bg-[#F4F4F5] rounded-[4px] font-mono">v2.4 Pro</span>
              </div>
              
              {/* Windows Window Controls */}
              <div style={{ WebkitAppRegion: 'no-drag' }} className="flex items-center space-x-1 -mr-1">
                <button 
                  onClick={handleWindowMinimize}
                  title="最小化" 
                  className="w-7 h-6 flex items-center justify-center rounded-[6px] hover:bg-[#E4E4E7] text-[#71717A] hover:text-[#18181B] transition-colors duration-150"
                >
                  <Icon name="minus" size={13} />
                </button>
                <button 
                  onClick={handleWindowMaximize}
                  title="最大化"

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
